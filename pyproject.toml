[project]
name = "heath"
version = "2025.1-beta.2"
description = ""
authors = [{ name = "Jonatan Skogsfors", email = "jonatan@skogsfors.net" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.0.3,<9",
    "tabulate>=0.8.9,<0.9",
    "gitpython>=3.1.41,<4",
]

[project.scripts]
heath = "heath.heath:main"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest~=7.1",
    "ruff>=0.13.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/heath"]

[tool.hatch.build.targets.wheel]
include = ["src/heath"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "F",  # pyflakes
    "E", # pycodestyle: error
    "W",  # pycodestyle: warning
    "I",  # isort: unsorted-imports
    "RUF"  # Ruff-specific rules
]

[project]
name = "heath"
version = "0.1.12"
description = ""
authors = [{ name = "Jonatan Skogsfors", email = "jonatan@skogsfors.net" }]
requires-python = ">=3.13"
dependencies = [
    "click==8.4.2",
    "tabulate==0.10.0",
    "gitpython==3.1.59",
]

[project.scripts]
heath = "heath.heath:main"

[dependency-groups]
dev = [
    "pre-commit~=4.6",
    "pytest~=9.1",
    "ruff~=0.16",
]

[tool.hatch.build.targets.sdist]
include = ["src/heath"]

[tool.hatch.build.targets.wheel]
include = ["src/heath"]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "F",  # pyflakes
    "E", # pycodestyle: error
    "W",  # pycodestyle: warning
    "I",  # isort
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
    "UP"  # pyupgrade
]
